name: CI / CD

on:
  push:
    branches: [ main, dev ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run test suite
        run: npm test

      - name: Verify CLI version command
        run: node bin/cli.js --version

      - name: Verify CLI help command
        run: node bin/cli.js --help

      - name: Verify CLI doctor command
        run: node bin/cli.js doctor --json

      - name: Verify package bundle contents (dry-run)
        run: npm pack --dry-run

  publish:
    name: Publish to NPM
    needs: test
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.ref == 'refs/heads/main' && (startsWith(github.event.head_commit.message, 'chore(release)') || contains(github.event.head_commit.message, '[release]')))
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for NPM Publishing
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Check version and publish to NPM
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          EXISTS_ON_NPM=$(npm view "fogoe@${LOCAL_VERSION}" version 2>/dev/null || echo "")

          echo "Local version:    $LOCAL_VERSION"
          echo "Registry status:  ${EXISTS_ON_NPM:-not published}"

          if [ -n "$EXISTS_ON_NPM" ]; then
            echo "ℹ️ Version $LOCAL_VERSION is already published on npm. Skipping publish."
            exit 0
          fi

          echo "🚀 Publishing fogoe@$LOCAL_VERSION to npm..."
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
